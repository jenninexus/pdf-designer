<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdf-designer — Vault overview</title>
<link rel="stylesheet" href="/_hub/hub.css">
</head>
<body class="hub-page">
<header class="hub-bar" aria-label="Vault toolbar">
  <div class="hub-bar-scroll">
    <div class="hub-group hub-brand-group">
      <a class="hub-brand" href="/" title="Home">Design Hub</a>
    </div>
    <nav class="hub-group hub-nav" aria-label="Hub sections">
      <a class="hub-link" href="/" title="Document library">Library</a>
      <a class="hub-link" href="/recipes" title="Browse layouts/ + themes/presets">Recipes</a>
      <a class="hub-link on" href="/vault" title="Readable vault · skills · go-to résumés" aria-current="page">Vault</a>
    </nav>
    <div class="hub-group" title="Profiles">
      <select id="personFilter" title="Profiles" aria-label="Profiles">
        <option value="examples">examples</option>
      </select>
    </div>
  </div>
  <div class="hub-bar-pin" aria-label="Pinned actions">
    <button id="refreshBtn" type="button" class="hub-icon-btn" title="Reload vault overview" aria-label="Refresh">
      <svg class="hub-icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M105.1 202.6c7.7-21.8 20.2-42.3 37.8-59.8c62.5-62.5 163.8-62.5 226.3 0L386.3 160 352 160c-17.7 0-32 14.3-32 32s14.3 32 32 32l111.5 0c0 0 0 0 0 0l.4 0c17.7 0 32-14.3 32-32l0-112c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 35.2L414.4 97.6c-87.5-87.5-229.3-87.5-316.8 0C73.2 122 55.6 150.7 44.8 181.4c-5.9 16.7 2.9 34.9 19.5 40.8s34.9-2.9 40.8-19.5zM39 289.3c-5 1.5-9.8 4.2-13.7 8.2c-4 4-6.7 8.8-8.1 14c-.3 1.2-.6 2.5-.8 3.8c-.3 1.7-.4 3.4-.4 5.1L16 432c0 17.7 14.3 32 32 32s32-14.3 32-32l0-35.1 17.6 17.5c0 0 0 0 0 0c87.5 87.4 229.3 87.4 316.7 0c24.4-24.4 42.1-53.1 52.9-83.8c5.9-16.7-2.9-34.9-19.5-40.8s-34.9 2.9-40.8 19.5c-7.7 21.8-20.2 42.3-37.8 59.8c-62.5 62.5-163.8 62.5-226.3 0l-.1-.1L125.6 352l34.4 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L48.4 288c-1.6 0-3.2 .1-4.8 .3s-3.1 .5-4.6 1z"/></svg>
    </button>
  </div>
</header>
<main class="hub-page-wrap">
  <h1>Vault · Skills · Go-to résumés</h1>
  <p class="hub-page-lead">Readable overview of <code>users/</code> · <code>vaults/</code> · <code>profiles/</code>. Default view is the public <code>examples</code> card (Jane Example). Pick a personal profile in the header to see that vault.</p>
  <div id="err" class="empty" hidden></div>
  <div id="root" class="empty">Loading…</div>
</main>
<script>
const HUB_PROFILE_KEY = "pdf-designer.hub.profileFilter";

function selectedProfile() {
  const params = new URLSearchParams(location.search);
  if (params.get("profile")) return params.get("profile");
  try {
    const stored = localStorage.getItem(HUB_PROFILE_KEY);
    if (stored) return stored;
  } catch (_) {}
  return "examples";
}

function fillProfileSelect(ids, current) {
  const sel = document.getElementById("personFilter");
  if (!sel) return;
  const list = Array.isArray(ids) && ids.length ? ids : ["examples"];
  sel.innerHTML = "";
  for (const id of list) {
    const o = document.createElement("option");
    o.value = id;
    o.textContent = id;
    sel.appendChild(o);
  }
  sel.value = list.includes(current) ? current : (list[0] || "examples");
}

async function load() {
  const root = document.getElementById("root");
  const err = document.getElementById("err");
  err.hidden = true;
  const profile = selectedProfile();
  try {
    const r = await fetch("/api/vault-overview?profile=" + encodeURIComponent(profile), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    fillProfileSelect(data.profileIds, data.selectedProfile || profile);
    if (!data.users || !data.users.length) {
      root.innerHTML = "<p class='empty'>No vaults found. A clone should still have <code>users/examples.json</code> — add <code>users/&lt;you&gt;.json</code> for a personal card.</p>";
      return;
    }
    root.innerHTML = "";
    if (data.hiddenPersonal) {
      const note = document.createElement("p");
      note.className = "hub-page-lead";
      note.textContent = data.hiddenPersonal + " personal vault"
        + (data.hiddenPersonal === 1 ? "" : "s")
        + " hidden — pick that profile in the header to open it.";
      root.appendChild(note);
    }
    for (const u of data.users) {
      const el = document.createElement("section");
      el.className = "hub-card";
      const tags = (u.boardSkills && u.boardSkills.tags) || [];
      const packs = u.goToPacks || [];
      const tracks = u.tracks || [];
      el.innerHTML = `
        <h2>${esc(u.name || u.id)}</h2>
        <div class="hub-meta">
          ${esc(u.headline || "")}
          ${u.email ? " · " + esc(u.email) : ""}
          ${u.web ? " · <a href='" + esc(u.web) + "' target='_blank' rel='noopener'>" + esc(stripProto(u.web)) + "</a>" : ""}
          ${u.vaultFile ? "<br>Vault: <code>" + esc(u.vaultFile) + "</code>" : ""}
        </div>
        <h3 class="hub-section-label">Board skills (${tags.length})</h3>
        <div class="hub-chips">${tags.length ? tags.map(t =>
          `<span class="hub-tag">${esc(t.label)}<span class="g">${esc(t.group || "")}</span></span>`
        ).join("") : "<span class='empty'>No boardSkills yet</span>"}</div>
        <h3 class="hub-section-label">Go-to résumé packs</h3>
        <div class="hub-table-scroll">
        <table>
          <thead><tr><th>Pack</th><th>Targets</th><th>Open</th></tr></thead>
          <tbody>
            ${packs.length ? packs.map(p => `
              <tr>
                <td><strong>${esc(p.label)}</strong>${p.rule ? "<br><span class='hub-meta'>" + esc(p.rule) + "</span>" : ""}</td>
                <td>${esc(p.targets || p.focus || "")}</td>
                <td>${p.htmlExists
                  ? `<a class="hub-open" href="/?doc=${encodeURIComponent(p.html)}" title="Select in Design Hub library">Open in library</a>
                     <span class="ok">✓</span>
                     <br><a class="raw" href="/${esc(p.html)}" target="_blank" rel="noopener" title="Raw HTML">raw HTML</a>
                     <code class="path-mini">${esc(p.html)}</code>`
                  : `<span class="missing">${esc(p.html || "—")} missing</span>`}</td>
              </tr>`).join("") : "<tr><td colspan='3' class='empty'>No goToPacks</td></tr>"}
          </tbody>
        </table>
        </div>
        <h3 class="hub-section-label">Role tracks</h3>
        <div class="hub-table-scroll">
        <table>
          <thead><tr><th>Track</th><th>Covers</th></tr></thead>
          <tbody>
            ${tracks.map(t => `<tr><td><code>${esc(t.id)}</code></td><td>${esc(t.covers || "")}</td></tr>`).join("")}
          </tbody>
        </table>
        </div>
        ${(() => {
          const linked = (data.profiles || []).filter(p => p.user === u.id);
          if (!linked.length) return "";
          return `<h3 class="hub-section-label">Profile</h3>
            <div class="hub-table-scroll">
            <table>
              <thead><tr><th>Id</th><th>Pages</th><th>Description</th></tr></thead>
              <tbody>
                ${linked.map(p => `
                  <tr>
                    <td><code>${esc(p.id)}</code></td>
                    <td>${p.pages != null ? esc(String(p.pages)) : "—"}</td>
                    <td>${esc(p.description || "")}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
            </div>`;
        })()}
      `;
      root.appendChild(el);
    }
    const orphanProfiles = (data.profiles || []).filter(p =>
      !(data.users || []).some(u => u.id === p.user)
    );
    if (orphanProfiles.length) {
      const sec = document.createElement("section");
      sec.className = "hub-card";
      sec.innerHTML = `<h2>Other profiles</h2>
        <div class="hub-table-scroll">
        <table>
          <thead><tr><th>Id</th><th>User</th><th>Pages</th><th>Description</th></tr></thead>
          <tbody>
            ${orphanProfiles.map(p => `
              <tr>
                <td><code>${esc(p.id)}</code></td>
                <td>${esc(p.user || "—")}</td>
                <td>${p.pages != null ? esc(String(p.pages)) : "—"}</td>
                <td>${esc(p.description || "")}</td>
              </tr>`).join("")}
          </tbody>
        </table>
        </div>`;
      root.appendChild(sec);
    }
  } catch (e) {
    err.hidden = false;
    err.textContent = "Failed to load /api/vault-overview: " + e.message;
    root.textContent = "";
  }
}
function stripProto(url) {
  return String(url || "").replace(/^https?:\/\//, "");
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
document.getElementById("refreshBtn").onclick = load;
document.getElementById("personFilter").addEventListener("change", () => {
  const v = document.getElementById("personFilter").value;
  try { localStorage.setItem(HUB_PROFILE_KEY, v); } catch (_) {}
  const u = new URL(location.href);
  u.searchParams.set("profile", v);
  history.replaceState(null, "", u.pathname + u.search);
  load();
});
load();
</script>
</body>
</html>
