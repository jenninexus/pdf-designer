<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdf-designer — Recipe gallery</title>
<link rel="stylesheet" href="/_hub/hub.css">
</head>
<body class="hub-page">
<header class="hub-bar" aria-label="Recipe gallery toolbar">
  <a class="hub-brand hub-link" href="/">Design Hub</a>
  <nav class="hub-nav" aria-label="Hub sections">
    <a class="hub-link" href="/" title="Document library">Library</a>
    <a class="hub-link on" href="/recipes" title="Browse layouts/ + themes/presets" aria-current="page">Recipes</a>
    <a class="hub-link" href="/vault" title="Readable vault · skills · go-to résumés">Vault</a>
  </nav>
  <div class="hub-spacer"></div>
  <button id="refreshBtn" type="button" title="Reload recipe gallery">↻ Refresh</button>
</header>
<main class="hub-page-wrap">
  <h1>Recipe gallery · Layouts + palettes</h1>
  <p class="hub-page-lead">Browse tracked <code>layouts/</code> (structure) and <code>themes/presets/</code> (color). Same registries the CLI already uses — discovery chrome, not a second renderer.</p>
  <div id="err" class="empty" hidden></div>
  <div id="root" class="empty">Loading…</div>
</main>
<script>
async function load() {
  const root = document.getElementById("root");
  const err = document.getElementById("err");
  err.hidden = true;
  try {
    const r = await fetch("/api/recipe-gallery", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const counts = data.counts || {};
    root.innerHTML = "";

    const collage = data.collageRecipes || [];
    root.appendChild(section(
      `Collage recipes (${counts.collage ?? collage.length})`,
      "layouts/collage/*.json — <code>python -m pdf_tool.collage --recipe &lt;id&gt;</code>",
      collageTable(collage)
    ));

    const resume = data.resumeLayouts || [];
    root.appendChild(section(
      `Resume page models (${counts.resume ?? resume.length})`,
      "layouts/*.json — house geometry (equal margins, content-fit).",
      resumeTable(resume)
    ));

    const palettes = data.palettePresets || [];
    root.appendChild(section(
      `Palette presets (${counts.palettes ?? palettes.length})`,
      "themes/presets/*.json — audition in the Hub swapper (or deep-link below).",
      paletteGrid(palettes)
    ));

    if (data.hubHint) {
      const p = document.createElement("p");
      p.className = "hub-hint";
      p.textContent = data.hubHint;
      root.appendChild(p);
    }
    if (data.cli && data.cli.listRecipes) {
      const p = document.createElement("p");
      p.className = "hub-hint";
      p.innerHTML = "CLI list: <code>" + esc(data.cli.listRecipes) + "</code>";
      root.appendChild(p);
    }
  } catch (e) {
    err.hidden = false;
    err.textContent = "Failed to load /api/recipe-gallery: " + e.message;
    root.textContent = "";
  }
}

function section(title, sub, bodyEl) {
  const el = document.createElement("section");
  el.className = "hub-card";
  const h = document.createElement("h2");
  h.textContent = title;
  const s = document.createElement("p");
  s.className = "sub";
  s.innerHTML = sub;
  el.appendChild(h);
  el.appendChild(s);
  el.appendChild(bodyEl);
  return el;
}

function collageTable(rows) {
  if (!rows.length) return emptyNode("No collage recipes found (layouts/collage/).");
  const wrap = document.createElement("div");
  wrap.className = "hub-table-scroll";
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Id</th><th>Structure</th><th>Best for</th><th>Use</th></tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td><strong>${esc(r.id)}</strong>
              <span class="hub-meta"><br>${esc(r.path || "")}</span></td>
            <td><code>${esc(r.family || "?")}</code>
              <span class="hub-meta"><br>${esc(r.canvas || "")}${r.px ? " · " + esc(r.px) : ""}
              ${r.fit ? " · fit=" + esc(r.fit) : ""}
              ${r.background ? " · bg=" + esc(r.background) : ""}</span></td>
            <td>${esc(r.bestFor || "")}${r.notes ? "<br><span class='hub-meta'>" + esc(r.notes) + "</span>" : ""}</td>
            <td>
              <button type="button" class="copy" data-copy="${escAttr(r.cli || "")}">Copy CLI</button>
              <a class="hub-open" href="/${esc(r.path || "")}" target="_blank" rel="noopener">raw JSON</a>
              <code class="cmd">${esc(r.cli || "")}</code>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;
  wrap.querySelectorAll("button.copy").forEach(bindCopy);
  return wrap;
}

function resumeTable(rows) {
  if (!rows.length) return emptyNode("No document layouts found (layouts/*.json).");
  const wrap = document.createElement("div");
  wrap.className = "hub-table-scroll";
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Id</th><th>Page</th><th>Best for</th><th>Guards</th></tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td><strong>${esc(r.id)}</strong>
              <span class="hub-meta"><br>${esc(r.path || "")}</span>
              <br><a class="hub-open" href="/${esc(r.path || "")}" target="_blank" rel="noopener">raw JSON</a></td>
            <td>${esc(r.pageSize || "Letter")} · margin ${esc(r.margin || "—")}
              ${r.contentHeightIn != null ? "<br><span class='hub-meta'>content ≈ " + esc(String(r.contentHeightIn)) + "in tall</span>" : ""}
              ${r.expectedPages ? "<br><span class='hub-meta'>pages: " + esc(JSON.stringify(r.expectedPages)) + "</span>" : ""}</td>
            <td>${esc(r.bestFor || "")}</td>
            <td><span class="hub-meta">${esc((r.guards || []).join(", ") || "—")}</span></td>
          </tr>`).join("")}
      </tbody>
    </table>`;
  return wrap;
}

function paletteGrid(rows) {
  if (!rows.length) return emptyNode("No presets found (themes/presets/).");
  const wrap = document.createElement("div");
  wrap.className = "hub-palette-grid";
  for (const p of rows) {
    const card = document.createElement("div");
    card.className = "hub-palette-card";
    const dark = (p.modes && p.modes.dark) || {};
    const light = (p.modes && p.modes.light) || {};
    card.innerHTML = `
      <h3>${esc(p.name || p.id)}</h3>
      <p class="hub-meta">${esc(p.description || "")}</p>
      <p class="hub-meta">${esc(p.aesthetic || "")}</p>
      <div class="hub-meta" style="margin-top:8px">Dark</div>
      ${swatchRow(dark.swatches)}
      <a class="hub-open" href="${esc(dark.hubUrl || "/")}">Try dark in Hub</a>
      <div class="hub-meta" style="margin-top:8px">Light</div>
      ${swatchRow(light.swatches)}
      <a class="hub-open" href="${esc(light.hubUrl || "/")}">Try light in Hub</a>
      <code class="cmd">${esc(p.path || "")}</code>`;
    wrap.appendChild(card);
  }
  return wrap;
}

function swatchRow(swatches) {
  if (!swatches || !Object.keys(swatches).length) return "<span class='empty'>no swatches</span>";
  const keys = ["--bg", "--primary", "--secondary", "--accent", "--support"];
  return `<div class="hub-swatches">${keys.filter(k => swatches[k]).map(k =>
    `<span class="hub-swatch" title="${esc(k)} ${esc(swatches[k])}" style="background:${esc(swatches[k])}"></span>`
  ).join("")}</div>`;
}

function emptyNode(msg) {
  const p = document.createElement("p");
  p.className = "empty";
  p.textContent = msg;
  return p;
}

function bindCopy(btn) {
  btn.addEventListener("click", async () => {
    const text = btn.getAttribute("data-copy") || "";
    try {
      await navigator.clipboard.writeText(text);
      const prev = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = prev; }, 1200);
    } catch (_) {
      btn.textContent = "Copy failed";
    }
  });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
function escAttr(s) {
  return esc(s).replace(/`/g, "&#96;");
}
document.getElementById("refreshBtn").onclick = load;
load();
</script>
</body>
</html>
