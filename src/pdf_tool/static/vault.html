<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdf-designer — Vault overview</title>
<link rel="stylesheet" href="/_hub/hub.css">
<style>
  .vault-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 24px 48px; }
  .vault-wrap h1 { margin: 0 0 6px; font-size: 1.45rem; }
  .vault-lead { color: var(--dash-text-muted, #9a8eab); margin: 0 0 22px; font-size: 0.95rem; max-width: 62ch; }
  .vault-nav { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .vault-nav a {
    color: var(--dash-accent, #c46bff);
    text-decoration: none;
    border: 1px solid var(--dash-border, rgba(165,99,209,.35));
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  .vault-nav a:hover { filter: brightness(1.08); }
  .person {
    border: 1px solid var(--dash-border, rgba(165,99,209,.28));
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 18px;
    background: rgba(18, 10, 28, 0.55);
  }
  .person h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .meta { color: var(--dash-text-muted, #9a8eab); font-size: 0.85rem; margin-bottom: 12px; }
  .meta a { color: var(--dash-accent, #c46bff); }
  h3 { margin: 14px 0 8px; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dash-accent, #c46bff); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    border: 1px solid var(--dash-border, rgba(165,99,209,.35));
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 0.78rem;
    color: var(--dash-text, #e0d5eb);
    background: rgba(165, 99, 209, 0.1);
  }
  .chip .g { opacity: 0.55; margin-left: 6px; font-size: 0.7rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(165,99,209,.18); vertical-align: top; }
  th { color: var(--dash-text-muted, #9a8eab); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
  td a { color: var(--dash-accent, #c46bff); text-decoration: none; }
  .ok { color: #6bffd6; }
  .missing { color: #ff6b9a; }
  .empty { color: var(--dash-text-muted, #9a8eab); font-style: italic; }
  #err { color: #ff6b9a; }
  a.hub-open {
    display: inline-block;
    margin-right: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--dash-border, rgba(165,99,209,.45));
    background: rgba(165, 99, 209, 0.18);
    font-size: 0.8rem;
    font-weight: 600;
  }
  a.raw { font-size: 0.72rem; opacity: 0.75; margin-right: 6px; }
  code.path-mini {
    display: block;
    margin-top: 4px;
    font-size: 0.68rem;
    color: var(--dash-text-muted, #9a8eab);
    word-break: break-all;
  }
</style>
</head>
<body>
<header class="hub-bar" aria-label="Vault toolbar">
  <a class="hub-brand hub-link" href="/">Design Hub</a>
  <span class="hub-pill">Vault</span>
  <div class="hub-spacer"></div>
  <button id="refreshBtn" type="button">↻ Refresh</button>
</header>
<main class="vault-wrap">
  <h1>Vault · Skills · Go-to résumés</h1>
  <p class="vault-lead">Readable overview of <code>storage/users</code>, profiles, board skill tags, and default résumé packs — so you don’t have to dig through JSON.</p>
  <div class="vault-nav">
    <a href="/">← Back to library</a>
    <a href="/recipes">Recipes</a>
  </div>
  <div id="err" class="empty" hidden></div>
  <div id="root" class="empty">Loading…</div>
</main>
<script>
async function load() {
  const root = document.getElementById("root");
  const err = document.getElementById("err");
  err.hidden = true;
  try {
    const r = await fetch("/api/vault-overview", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (!data.users || !data.users.length) {
      root.innerHTML = "<p class='empty'>No vaults found under storage/ (expected on a white-label clone).</p>";
      return;
    }
    root.innerHTML = "";
    for (const u of data.users) {
      const el = document.createElement("section");
      el.className = "person";
      const tags = (u.boardSkills && u.boardSkills.tags) || [];
      const packs = u.goToPacks || [];
      const tracks = u.tracks || [];
      el.innerHTML = `
        <h2>${esc(u.name || u.id)}</h2>
        <div class="meta">
          ${esc(u.headline || "")}
          ${u.email ? " · " + esc(u.email) : ""}
          ${u.web ? " · <a href='" + esc(u.web) + "' target='_blank' rel='noopener'>" + esc(u.web.replace(/^https?:\\/\\//, "")) + "</a>" : ""}
          ${u.vaultFile ? "<br>Vault: <code>" + esc(u.vaultFile) + "</code>" : ""}
        </div>
        <h3>Board skills (${tags.length})</h3>
        <div class="chips">${tags.length ? tags.map(t =>
          `<span class="chip">${esc(t.label)}<span class="g">${esc(t.group || "")}</span></span>`
        ).join("") : "<span class='empty'>No boardSkills yet</span>"}</div>
        <h3>Go-to résumé packs</h3>
        <table>
          <thead><tr><th>Pack</th><th>Targets</th><th>Open</th></tr></thead>
          <tbody>
            ${packs.length ? packs.map(p => `
              <tr>
                <td><strong>${esc(p.label)}</strong>${p.rule ? "<br><span class='meta'>" + esc(p.rule) + "</span>" : ""}</td>
                <td>${esc(p.targets || p.focus || "")}</td>
                <td>${p.htmlExists
                  ? `<a class="hub-open" href="/?doc=${encodeURIComponent(p.html)}" title="Select in Design Hub library">Open in library</a>
                     <span class="ok">✓</span>
                     <br><a class="raw" href="/${esc(p.html)}" target="_blank" rel="noopener" title="Raw HTML">raw HTML</a>
                     <code class="path-mini">${esc(p.html)}</code>`
                  : `<span class="missing">${esc(p.html || "—")} missing</span>`}</td>
              </tr>`).join("") : "<tr><td colspan='3' class='empty'>No goToPacks</td></tr>"}
          </tbody>
        </table>
        <h3>Role tracks</h3>
        <table>
          <thead><tr><th>Track</th><th>Covers</th></tr></thead>
          <tbody>
            ${tracks.map(t => `<tr><td><code>${esc(t.id)}</code></td><td>${esc(t.covers || "")}</td></tr>`).join("")}
          </tbody>
        </table>
        ${(() => {
          const linked = (data.profiles || []).filter(p => p.user === u.id);
          if (!linked.length) return "";
          return `<h3>Profile</h3>
            <table>
              <thead><tr><th>Id</th><th>Pages</th><th>Description</th></tr></thead>
              <tbody>
                ${linked.map(p => `
                  <tr>
                    <td><code>${esc(p.id)}</code></td>
                    <td>${p.pages != null ? esc(String(p.pages)) : "—"}</td>
                    <td>${esc(p.description || "")}</td>
                  </tr>`).join("")}
              </tbody>
            </table>`;
        })()}
      `;
      root.appendChild(el);
    }
    const orphanProfiles = (data.profiles || []).filter(p =>
      !(data.users || []).some(u => u.id === p.user)
    );
    if (orphanProfiles.length) {
      const sec = document.createElement("section");
      sec.className = "person";
      sec.innerHTML = `<h2>Other profiles</h2>
        <table>
          <thead><tr><th>Id</th><th>User</th><th>Pages</th><th>Description</th></tr></thead>
          <tbody>
            ${orphanProfiles.map(p => `
              <tr>
                <td><code>${esc(p.id)}</code></td>
                <td>${esc(p.user || "—")}</td>
                <td>${p.pages != null ? esc(String(p.pages)) : "—"}</td>
                <td>${esc(p.description || "")}</td>
              </tr>`).join("")}
          </tbody>
        </table>`;
      root.appendChild(sec);
    }
  } catch (e) {
    err.hidden = false;
    err.textContent = "Failed to load /api/vault-overview: " + e.message;
    root.textContent = "";
  }
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
document.getElementById("refreshBtn").onclick = load;
load();
</script>
</body>
</html>
