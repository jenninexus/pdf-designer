[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-designer"
version = "0.4.0"
description = "HTML -> print-perfect PDF/PNG toolkit: themed resumes, cover letters, collages, and a live design previewer."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

# Every dependency is permissive (Apache-2.0 / BSD-3 / MIT), so the MIT license
# on this project is honest and unqualified.
#
# PyMuPDF was REMOVED (2026-07-13): it is AGPL-3.0, and a mandatory AGPL dependency
# makes an MIT license claim incoherent -- you cannot grant rights you don't hold.
# It was used only to rasterize PDF pages; pdf_to_png.py now screenshots the HTML
# source in the Chromium we already ship. See docs/LICENSING-NOTES.md.
dependencies = [
    "playwright>=1.40",   # Apache-2.0
    "pypdf>=4.0",         # BSD-3-Clause
    "Pillow>=10.0",       # MIT-CMU
]

[project.scripts]
pdf-designer = "pdf_tool.__main__:entry_hub"
pdf-designer-preview = "pdf_tool.preview:main"
pdf-designer-check-generation = "pdf_tool.__main__:entry_check_generation"
pdf-designer-check-palette = "pdf_tool.__main__:entry_check_palette"
pdf-designer-check-vault = "pdf_tool.__main__:entry_check_vault"
pdf-designer-check-ats = "pdf_tool.__main__:entry_check_ats"
pdf-designer-tracker = "pdf_tool.__main__:entry_tracker"
pdf-designer-variants = "pdf_tool.__main__:entry_variants"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
pdf_tool = ["static/*"]
