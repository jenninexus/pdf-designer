<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Default Collage — Hero Mosaic Reference (pdf-designer)</title>
<style>
  /* Tokens from ../../../themes/default-collage.json — hero-mosaic family,
     6 images, Letter portrait. Tiles are CSS-gradient placeholders; swap in
     real <img src="..." style="object-fit:cover"> for a real collage. */
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --caption-text: rgba(240,242,246,0.94);
    --caption-dim: rgba(240,242,246,0.68);
    --cell-border: rgba(79,209,201,0.14);
    --gutter: 12px;
    --cell-radius: 10px;
    --sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  @page { size: Letter; margin: 0.35in; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--caption-text);
    font-family: var(--sans);
  }

  .canvas {
    width: 8.5in;
    height: 11in;
    margin: 24px auto;
    padding: 0.35in;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: var(--gutter);
    box-shadow: 0 22px 60px rgba(0,0,0,0.3), 0 0 0 1px var(--cell-border);
  }

  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: 0.01em;
  }
  .sub { margin: 0 0 4px; font-size: 12px; color: var(--caption-dim); }

  /* Hero mosaic: hero spans 2x2 of a 3x3 grid; 5 supporting tiles fill the rest. */
  .mosaic {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: var(--gutter);
  }
  .tile {
    border-radius: var(--cell-radius);
    border: 1px solid var(--cell-border);
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    padding: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero { grid-column: 1 / 3; grid-row: 1 / 3; }

  /* Placeholder gradients standing in for photos */
  .p1 { background: linear-gradient(135deg, #164e63, #4fd1c9); }
  .p2 { background: linear-gradient(135deg, #4c1d95, #9d8cd9); }
  .p3 { background: linear-gradient(135deg, #7c2d12, #e3b559); }
  .p4 { background: linear-gradient(135deg, #1e3a8a, #6aa7ff); }
  .p5 { background: linear-gradient(135deg, #134e4a, #34d399); }
  .p6 { background: linear-gradient(135deg, #831843, #f472b6); }

  @media print {
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --caption-text: #171b24;
      --caption-dim: rgba(23,27,36,0.72);
      --cell-border: rgba(23,27,36,0.14);
    }
    html[data-pdf-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0d12;
      --caption-text: rgba(240,242,246,0.94);
      --caption-dim: rgba(240,242,246,0.68);
      --cell-border: rgba(79,209,201,0.14);
    }
    body { background: var(--bg); }
    .canvas {
      width: auto;
      height: 10.1in;
      margin: 0;
      padding: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
<div class="canvas">
  <h1>Project Showcase</h1>
  <p class="sub">hero-mosaic · 6 images · letter-portrait · see docs/COLLAGE-DESIGN.md for all layout families</p>
  <div class="mosaic">
    <div class="tile hero p1">hero image (2×2 span) — largest/featured shot</div>
    <div class="tile p2">supporting 1</div>
    <div class="tile p3">supporting 2</div>
    <div class="tile p4">supporting 3</div>
    <div class="tile p5">supporting 4</div>
    <div class="tile p6">supporting 5</div>
  </div>
</div>
</body>
</html>
