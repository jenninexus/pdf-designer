[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-designer"
version = "0.4.0"
description = "Local PDF toolkit for resumes, cover letters, work examples, presentations, and collages."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

# License and third-party notices are documented in docs/LICENSING-NOTES.md.
dependencies = [
    "playwright>=1.40",   # Apache-2.0
    "pypdf>=4.0",         # BSD-3-Clause
    "pypdfium2>=4.30",    # Apache-2.0 / BSD-3-Clause — real PDF-page previews + rendered QA
    "Pillow>=10.0",       # MIT-CMU
]

[project.scripts]
pdf-designer = "pdf_tool.__main__:entry_hub"
pdf-designer-preview = "pdf_tool.preview:main"
pdf-designer-check-generation = "pdf_tool.__main__:entry_check_generation"
pdf-designer-check-palette = "pdf_tool.__main__:entry_check_palette"
pdf-designer-check-vault = "pdf_tool.__main__:entry_check_vault"
pdf-designer-check-ats = "pdf_tool.__main__:entry_check_ats"
pdf-designer-tracker = "pdf_tool.__main__:entry_tracker"
pdf-designer-variants = "pdf_tool.__main__:entry_variants"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
# share/ is filled by scripts/sync-wheel-share.py before wheel builds (see docs/PACKAGING.md)
pdf_tool = ["static/*", "share/**/*"]
