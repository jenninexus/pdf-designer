<!DOCTYPE html>
<html lang="en" data-pdf-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jane Example — Work samples (example)</title>
<style>
  :root {
    --bg: #0b0d12; --surface: #10131a; --text: rgba(240,242,246,0.94);
    --dim: rgba(240,242,246,0.68); --border: rgba(79,209,201,0.18);
    --primary: #4fd1c9; --accent: #9d8cd9; --support: #6aa7ff;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  html[data-pdf-theme="light"] {
    --bg: #f5f7fa; --surface: #ffffff; --text: #171b24;
    --dim: rgba(23,27,36,0.72); --border: rgba(23,27,36,0.14);
    --primary: #087c78; --accent: #6f57c2; --support: #2b65b8;
  }
  @page { size: Letter; margin: 0.6in; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 11px; line-height: 1.5; }
  .page {
    display: flex; flex-direction: column;
    width: 8.5in; min-height: 11in; margin: 24px auto; padding: 0.6in;
    background: var(--surface); border: 1px solid var(--border);
  }
  .page-main { flex: 1 1 auto; min-height: 0; }
  .kicker { letter-spacing: 0.16em; text-transform: uppercase; color: var(--primary); font-size: 10px; font-weight: 700; margin: 0 0 4px; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  .sub { color: var(--dim); margin: 0 0 18px; }
  h2 { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: rgba(79,209,201,0.04); }
  .swatch { height: 118px; }
  .a { background: linear-gradient(135deg, #164e63, #4fd1c9); }
  .b { background: linear-gradient(135deg, #4c1d95, #9d8cd9); }
  .c { background: linear-gradient(135deg, #1e3a8a, #6aa7ff); }
  .cap { padding: 10px 12px; }
  .cap strong { display: block; font-size: 13px; margin-bottom: 4px; }
  .cap span { color: var(--dim); }
  .footer { margin-top: auto; align-self: flex-end; text-align: right; font-weight: 600; color: var(--text); }
  @media print {
    .page { width: auto; height: 9.8in; overflow: hidden; margin: 0; padding: 0; border: 0; }
  }
</style>
</head>
<body>
  <article class="page">
    <div class="page-main">
      <p class="kicker">Work samples · example</p>
      <h1>Jane Example</h1>
      <p class="sub">Fictional portfolio tiles — swap the gradients for your own stills.</p>
      <h2>Selected projects</h2>
      <div class="grid">
        <div class="card">
          <div class="swatch a"></div>
          <div class="cap"><strong>Résumé studio</strong><span>Vault → Hub → light + dark PDF</span></div>
        </div>
        <div class="card">
          <div class="swatch b"></div>
          <div class="cap"><strong>Letter layouts</strong><span>Equal margins · sign-off pinned left</span></div>
        </div>
        <div class="card">
          <div class="swatch c"></div>
          <div class="cap"><strong>Collage recipes</strong><span>Hero mosaic · filmstrip · scatter</span></div>
        </div>
      </div>
    </div>
    <p class="footer">jane@example.studio</p>
  </article>
</body>
</html>
