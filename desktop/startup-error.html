<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF Designer could not start</title>
    <style>
      body { background: #f7f8fc; color: #172033; font: 16px/1.5 system-ui, sans-serif; margin: 0; }
      main {
        box-sizing: border-box;
        width: calc(100% - 32px);
        max-width: 34rem;
        margin: clamp(16px, 8vh, 64px) auto;
        padding: clamp(16px, 4vw, 32px);
        background: #fff;
        border: 1px solid #dce1ea;
        border-radius: 12px;
      }
      h1 { font-size: 1.45rem; line-height: 1.2; margin: 0 0 0.75rem; }
      p { margin: 0; }
      @media (max-height: 320px) {
        body { font-size: 14px; }
        h1 { font-size: 1.2rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PDF Designer could not start</h1>
      <p>Close and reopen PDF Designer. If it still won’t start, reinstall the app or contact support with the time this message appeared.</p>
    </main>
  </body>
</html>
