<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example gallery — hero mosaic</title>
<style>
  body { margin: 0; background: #0b0d12; color: #e8e6f0; font-family: "Segoe UI", system-ui, sans-serif; }
  .mosaic { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; height: 100vh; padding: 14px; box-sizing: border-box; }
  .tile { border-radius: 10px; border: 1px solid rgba(79,209,201,0.22); }
  .hero { grid-row: 1 / 3; background: linear-gradient(135deg, #164e63, #4fd1c9); }
  .a { background: linear-gradient(135deg, #4c1d95, #9d8cd9); }
  .b { background: linear-gradient(135deg, #1e3a8a, #6aa7ff); }
</style>
</head>
<body>
  <div class="mosaic">
    <div class="tile hero"></div>
    <div class="tile a"></div>
    <div class="tile b"></div>
  </div>
</body>
</html>
